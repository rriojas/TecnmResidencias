name: residenciastecnm-v2

services:
  postgres:
    image: postgres:18-alpine
    container_name: residencia-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgre_recidencias
      POSTGRES_USER: residency_user
      POSTGRES_PASSWORD: SecurePassword2026!
    ports:
      - "5439:5432"
    volumes:
      - postgres_v2_data:/var/lib/postgresql
      - ./docs/database/01_schema_and_essential_seeds.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/database/02_demo_data.sql:/docker-entrypoint-initdb.d/02-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U residency_user -d postgre_recidencias"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./RTecNM_V2_Backend
      dockerfile: Dockerfile
    container_name: residencia-v2-backend
    restart: unless-stopped
    ports:
      - "5185:5185"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=postgre_recidencias;Username=residency_user;Password=SecurePassword2026!
      - Uploads__Path=uploads
      - SmtpSettings__Host=${SMTP_HOST:-smtp.office365.com}
      - SmtpSettings__Port=${SMTP_PORT:-587}
      - SmtpSettings__SenderName=${SMTP_SENDER_NAME:-TecNM Residencias}
      - SmtpSettings__SenderEmail=${SMTP_SENDER_EMAIL:-noreply@ejemplo.tecnm.mx}
      - SmtpSettings__Username=${SMTP_USERNAME:-noreply@ejemplo.tecnm.mx}
      - SmtpSettings__Password=${SMTP_PASSWORD:-TU_CONTRASEÑA_AQUI}
      - SmtpSettings__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - SmtpSettings__UseMockInDev=${SMTP_USE_MOCK:-true}
    volumes:
      - ./RTecNM_V2_Backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./RTecNM_V2_Frontend
      dockerfile: Dockerfile
    container_name: residencia-v2-frontend
    restart: unless-stopped
    ports:
      - "5085:80"
    depends_on:
      - backend

volumes:
  postgres_v2_data:

