name: CI / Build & Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Build & Validate Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore RTecNM_V2_Backend/TecNM.Residency.csproj

      - name: Build Backend (.NET 10)
        run: dotnet build RTecNM_V2_Backend/TecNM.Residency.csproj --configuration Release --no-restore

  frontend-ci:
    name: Build & Validate Frontend (Vue / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'RTecNM_V2_Frontend/package-lock.json'

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: RTecNM_V2_Frontend

      - name: Build Frontend
        run: npm run build
        working-directory: RTecNM_V2_Frontend

  docker-ci:
    name: Build & Validate Docker Containers
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./RTecNM_V2_Backend
          file: ./RTecNM_V2_Backend/Dockerfile
          push: false
          tags: rtecnm-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./RTecNM_V2_Frontend
          file: ./RTecNM_V2_Frontend/Dockerfile
          push: false
          tags: rtecnm-frontend:latest

  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Connect via SSH and run deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_PATH || '.' }}
            git pull origin main
            chmod +x deploy-server.sh
            ./deploy-server.sh -y

